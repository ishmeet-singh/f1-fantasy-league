name: season-cron

on:
  schedule:
    # One off-peak frequent schedule runs both time-sensitive jobs. GitHub can
    # delay scheduled workflows; separate overlapping expressions previously
    # caused delayed reminder runs to skip result sync entirely.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
    - cron: "17 */6 * * *"   # every 6 hours — sync calendar
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Remove cancelled 2026 races (manual workflow only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/remove-cancelled-races"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Send reminder emails (every 5 minutes)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '2,7,12,17,22,27,32,37,42,47,52,57 * * * *' }}
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/send-reminders"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Call sync-results (every 5 minutes)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '2,7,12,17,22,27,32,37,42,47,52,57 * * * *' }}
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/sync-results"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Call sync-calendar (every 6 hours)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *' }}
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/sync-calendar"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  sync-fia-entries:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *' }}
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install FIA PDF parser
        run: python -m pip install "pypdf==5.9.0"
      - name: Sync official FIA race entry list
        run: python scripts/sync_fia_entries.py
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

