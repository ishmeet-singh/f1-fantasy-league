name: season-cron

on:
  schedule:
    # Reminders and result sync run from Supabase pg_cron every 5 minutes.
    # GitHub's schedule trigger was creating those runs hours apart, while the
    # jobs that did start finished in under a minute. Calendar sync and the
    # FIA roster script stay here because they only need a few runs a day.
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Remove cancelled 2026 races (manual workflow only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/remove-cancelled-races"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Send reminder emails (manual workflow only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/send-reminders"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Call sync-results (manual workflow only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/sync-results"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Call sync-calendar (every 6 hours)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *' }}
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/sync-calendar"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  sync-fia-entries:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *' }}
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install FIA PDF parser
        run: python -m pip install "pypdf==5.9.0"
      - name: Sync official FIA race entry list
        run: python scripts/sync_fia_entries.py
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
